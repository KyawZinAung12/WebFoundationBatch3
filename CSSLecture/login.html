
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #667eea;
        } 

        #login{
            display: flex;
            justify-content: center;
            height: 100vh;
            align-items: center !important;
        }
         

        .login-box {
            width: 400px;
            padding: 35px;
            background: #fff;
            border-radius: 15px;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 12px !important;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .input-box input:focus {
            border-color: #667eea;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .options a,
        .signup a {
            color: #667eea;
            text-decoration: none;
        }

        .options a:hover,
        .signup a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #5265d5;
        }

        .signup {
            margin-top: 20px;
            font-size: 13px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="login">

        <div class="login-box">
            <h2>Welcome Back!</h2>
            <p>Please login to your account</p>

            <form>
                <div class="input-box">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                        placeholder="Enter your email" required>
                </div>

                <div class="input-box">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                        placeholder="Enter your password" required>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>
            </form>

            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>
        </div>
    </div>


</body>
</html>
