<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparsion</title>
</head>
<body>
    <h1>Comparsion Lessons</h1>
    <script>
        // true / false
        // greather than  >
        let a = '10';
        let b = 10;
        console.log(a > b);

        // greather than equal >=
        console.log(a >= b); 

        // less than <
        console.log(a < b);

        // less than equal <=
        console.log(a <= b);

        // double equal == value 
        console.log(a == b);

        // triple equal === datatype & value
        console.log(a === b);

        // not equal != value
        console.log(a != b);

        // not double equal !== datatype & value
        console.log(a !== b);







        


    </script>
</body>
</html>
