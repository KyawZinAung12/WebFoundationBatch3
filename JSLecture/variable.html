<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Varibales</h1>


    <script>

        // global variable (var)
        var name = "Kyaw Zin Aung";
        name = "Kyaw Gyi";
        console.log(name);

        // block scope variable (let)
        let fatherName = "U Maung Nyo";
        fatherName = "U Maung Nyo Update";
        console.log(fatherName);

        // const variable (const)
        const motherName = "Daw Kyin Ohn";
        console.log(motherName);
        

    </script>
</body>
</html>
