<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator</title>
</head>
<body>
    <h1>Operator Lessons</h1>
    
    <script>
        // assign operator =
        let name = "Kyaw Zin Aung";
        console.log(name);

        // addition operator +
        let number = 398108402 + 4892348579;
        console.log(number);
        let fiveFour = '5' + 4;
        console.log(fiveFour);
        let no = 7;
        console.log(no);  // 7
        // no = no + 3;
        no += 3;
        console.log(no); // 10
        let num = 5;
        
        console.log(num++); // 5
        console.log(num); // 6
        console.log(++num);

        // subtraction operator -
        let sub = 10 - 5;
        let num1 = 4;
        let result = sub - num1;
        console.log(sub);
        console.log(result);

        // multiplication operator *
        let multi = 5 * 5;
        console.log(multi);
        multi *= 5; // multi = multi * 5;
        console.log(multi);

        // division operator /
        let div = 10 / 2;
        console.log(div);

        // remainder operator %
        let remainder = 10 % 3;
        console.log(remainder);

        // exponent operator **
        let exp = 12 ** 5;
        console.log(exp);

        // presendence operator 
        let pre = (4 + 5) - 2 * 5 / 2 % 3;
        // 9 - 2  
        console.log(pre);
         
        
        
        
        
        


        

    </script>
</body>
</html>
